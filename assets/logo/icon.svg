<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef0ff"/><stop offset=".45" stop-color="#22c8ee"/><stop offset="1" stop-color="#2f6bf2"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c8ee"/><stop offset="1" stop-color="#2f6bf2"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#062a5c" flood-opacity=".35"/></filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  </g>
  <!-- the long video -->
  <rect x="196" y="352" width="632" height="356" rx="44" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".55" stroke-width="20"/>
  <!-- the short clip -->
  <g filter="url(#sh)">
    <rect x="372" y="222" width="280" height="580" rx="58" fill="url(#card)"/>
  </g>
  <path d="M478 446 L478 578 Q478 596 494 588 L592 530 Q606 512 592 500 L494 436 Q478 428 478 446 Z" fill="url(#play)"/>
